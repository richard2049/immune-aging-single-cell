cfg_path: config/config.real.full.yml

project:
  name: immune_aging_scvi
  # 25k  -> results/gse164378_25k
  # 100k -> results/gse164378_100k
  # full -> results/gse164378_full
  out_dir: results/gse164378_full

run:
  dataset: custom_h5ad
  # Controlled scaling:
  # 25k  -> max_cells: 25000
  # 100k -> max_cells: 100000
  # full -> max_cells: null
  max_cells: 1000000
  seed: 42

paths:
  input_h5ad: data/raw/raw_counts_h5ad/pbmc_gex_raw_with_var_obs.h5ad

metadata:
  enabled: true
  require_all_matches: true
  parse_obs_names: true
  # Cell-level metadata from all_pbmcs tarball.
  table_path: data/raw/raw_counts_h5ad/all_pbmcs/all_pbmcs_metadata.csv
  table_sep: ","
  obs_join_key: obs_names
  table_join_key: cell_id
  table_columns: ["donor_id", "age", "sex", "age_group", "batch"]
  auto_standardize_columns: true
  rename_columns: {}
  sample_field: sample_id
  donor_field: donor_id
  batch_field: batch
  barcode_field: cell_barcode
  sample_delim: auto
  donor_index: 1

qc:
  # full mode on consumer hardware: skip QC step to avoid loading all X in RAM.
  # 25k/100k: true
  # full: false
  enabled: false
  min_genes_per_cell: 800
  min_cells_per_gene: 3
  n_genes_upper_quantile: 0.98
  max_pct_counts_mt: 20
  max_pct_counts_ribo: 50

doublets:
  # Recommendation:
  # 25k/100k -> false
  # full     -> keep false initially, enable only if resources allow
  enabled: false
  dif_threshold: 0.5
  hvg_top: 2000
  filter_genes_min_cells: 10
  hvg_flavor: seurat_v3

scvi:
  # Use X directly in full mode to avoid duplicating counts layer in memory.
  # 25k/100k: counts
  # full: null
  layer: null
  # Metadata integration creates canonical `batch` (prefer table batch, fallback parsed batch).
  categorical_covariates: ["batch"]
  # If qc.enabled=false, these columns are usually unavailable.
  continuous_covariates: []
  allow_missing_covariates: false
  # Default matches the portable CPU-only environment.yml.
  # For full-scale execution, GPU is usually faster but should be enabled only
  # after installing and validating a CUDA-enabled PyTorch build.
  accelerator: cpu
  devices: 1

clustering:
  use_rep: X_scVI
  leiden_resolution: 0.8

celltypist:
  # For full mode, enable only after confirming available RAM.
  enabled: true
  model: Immune_All_Low.pkl
  model_source: https://www.celltypist.org/models
  majority_voting: false
  # Stage recommendations:
  # 25k  -> 2000
  # 100k -> 5000
  # full -> 10000 (if RAM allows)
  chunk_size: 10000
  normalize_target_sum: 10000

report:
  dpi: 180
  max_celltypes_plot: 25
  # "auto" falls back to leiden if cell_type is unavailable in full mode.
  label_obs: cell_type
  # UMAP plotting defaults tuned for large datasets: auto point size (None),
  # slight transparency to reduce overplotting, and right-side legend.
  umap_point_size: auto
  umap_alpha: 0.85
  umap_legend_loc: right margin

composition_age:
  age_col: age
  donor_col: donor_id
  celltype_col: cell_type
  covariate_cols: ["sex", "batch"]
  adjust_covariates: true
  min_cells_per_donor: 500
  min_donors_per_age_bin: 15
  # Keep sparse bins in the figure (e.g., 75-85) but mark them as low-support.
  drop_sparse_age_bins: false
  sparse_age_bin_warn_threshold: 15
  sparse_age_bin_marker: "*"
  min_donors_per_celltype: 12
  min_donors_for_panel: 20
  bootstrap_iterations: 5000
  bootstrap_ci: 0.95
  plot_only_fdr_significant: true
  top_n_celltypes: 14
  top_n_trends: 10
  dpi: 180

signature_age:
  age_col: age
  donor_col: donor_id
  celltype_col: cell_type
  sex_col: sex
  covariate_cols: ["sex", "batch"]
  adjust_covariates: true
  normalize_target_sum: 10000
  assume_log1p: false
  sampling_strategy: stratified
  max_cells_for_scoring: 300000
  min_genes_present: 3
  min_cells_per_group: 120
  min_donors_per_celltype: 12
  min_donors_for_panel: 20
  plot_only_fdr_significant: true
  min_age_span: 12
  bootstrap_iterations: 5000
  bootstrap_ci: 0.95
  top_n_panels: 10
  dpi: 180

pseudobulk_de_feasibility:
  # Candidate design-gate settings only; these do not authorize DE execution.
  count_layer: null
  age_col: age
  donor_col: donor_id
  # `donor_id` labels are reused across pools. `tube_id` is the stable
  # biological replicate identifier in the source cell metadata.
  replicate_col: tube_id
  replicate_table_path: data/raw/raw_counts_h5ad/all_pbmcs/all_pbmcs_metadata.csv
  replicate_table_join_key: cell_id
  sample_col: sample_id
  sample_role: multiplexed_technical_library
  celltype_col: cell_type
  covariate_cols: ["sex", "batch"]
  candidate_min_cells_per_pseudobulk: 50
  candidate_min_donors_per_celltype: 12
  candidate_min_age_span: 12
  candidate_min_residual_df: 5
  integer_tolerance: 1.0e-6
  scan_rows_per_chunk: 2000
  progress_every_rows: 100000

age_prediction:
  latent_key: X_scVI
  age_col: age
  donor_col: donor_id
  celltype_col: cell_type
  clip_predictions_to_train_age_range: true
  sampling_strategy: stratified
  max_cells_for_aggregation: 350000
  min_cells_per_group: 120
  cv_folds: 5
  model_order: ["ridge", "hist_gbr", "xgboost"]
  ridge_alphas: [0.1, 1.0, 10.0, 100.0]
  hist_gbr_params:
    - {max_depth: 4, learning_rate: 0.05, max_iter: 300}
    - {max_depth: 6, learning_rate: 0.03, max_iter: 500}
  xgboost_params:
    - {n_estimators: 300, max_depth: 3, learning_rate: 0.05, subsample: 0.8, colsample_bytree: 0.8, reg_lambda: 1.0}
    - {n_estimators: 500, max_depth: 4, learning_rate: 0.05, subsample: 0.8, colsample_bytree: 0.8, reg_lambda: 1.0}
  bootstrap_iterations: 5000
  bootstrap_ci: 0.95
  n_jobs: -1
  top_n_celltypes_plot: 14
  min_groups_for_mae_plot: 20
  dpi: 180

analysis:
  age_bins: [25, 35, 45, 55, 65, 75, 85]

sensitivity_age:
  enabled: true
  include_baseline: true
  adjust_covariates_values: [true, false]
  drop_sparse_age_bins_values: [true, false]
  min_cells_per_group_values: [80, 120, 160]

supplementary_age:
  top_n_composition: 8
  top_n_signature: 8
  dpi: 180
