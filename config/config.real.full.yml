cfg_path: config/config.real.full.yml

project:
  name: immune_aging_scvi
  # 25k  -> results/gse164378_25k
  # 100k -> results/gse164378_100k
  # full -> results/gse164378_full
  out_dir: results/gse164378_full

run:
  dataset: custom_h5ad
  # Controlled scaling:
  # 25k  -> max_cells: 25000
  # 100k -> max_cells: 100000
  # full -> max_cells: null
  max_cells: 500000
  seed: 42

paths:
  input_h5ad: data/raw/raw_counts_h5ad/pbmc_gex_raw_with_var_obs.h5ad

metadata:
  enabled: true
  parse_obs_names: true
  # Cell-level metadata from all_pbmcs tarball.
  table_path: data/raw/raw_counts_h5ad/all_pbmcs/all_pbmcs_metadata.csv
  table_sep: ","
  obs_join_key: obs_names
  table_join_key: cell_id
  table_columns: ["donor_id", "age", "sex", "age_group", "batch"]
  auto_standardize_columns: true
  rename_columns: {}
  sample_field: sample_id
  donor_field: donor_id
  batch_field: batch
  barcode_field: cell_barcode
  sample_delim: auto
  donor_index: 1

qc:
  # full mode on consumer hardware: skip QC step to avoid loading all X in RAM.
  # 25k/100k: true
  # full: false
  enabled: false
  min_genes_per_cell: 200
  min_cells_per_gene: 3
  n_genes_upper_quantile: 0.98
  max_pct_counts_mt: 20
  max_pct_counts_ribo: 50

doublets:
  # Recommendation:
  # 25k/100k -> false
  # full     -> keep false initially, enable only if resources allow
  enabled: false
  dif_threshold: 0.5
  hvg_top: 2000
  filter_genes_min_cells: 10
  hvg_flavor: seurat_v3

scvi:
  # Use X directly in full mode to avoid duplicating counts layer in memory.
  # 25k/100k: counts
  # full: null
  layer: null
  # Only set these if columns exist in adata.obs.
  # Example: ["batch"] or ["batch", "donor_id"]
  categorical_covariates: []
  # If qc.enabled=false, these columns are usually unavailable.
  continuous_covariates: []
  # 25k/100k: CPU is recommended
  # full: switch to GPU only after CUDA is validated
  accelerator: gpu
  devices: 1

clustering:
  use_rep: X_scVI
  leiden_resolution: 0.8

celltypist:
  # For full mode, enable only after confirming available RAM.
  enabled: true
  model: Immune_All_Low.pkl
  majority_voting: false
  # Stage recommendations:
  # 25k  -> 2000
  # 100k -> 5000
  # full -> 10000 (if RAM allows)
  chunk_size: 10000
  normalize_target_sum: 10000

report:
  dpi: 180
  max_celltypes_plot: 25
  # "auto" falls back to leiden if cell_type is unavailable in full mode.
  label_obs: cell_type

composition_age:
  age_col: age
  donor_col: donor_id_y
  celltype_col: cell_type
  min_cells_per_donor: 500
  min_donors_per_celltype: 12
  top_n_celltypes: 14
  top_n_trends: 10
  dpi: 180

signature_age:
  age_col: age
  donor_col: donor_id_y
  celltype_col: cell_type
  sex_col: sex
  normalize_target_sum: 10000
  assume_log1p: false
  max_cells_for_scoring: 150000
  min_genes_present: 3
  min_cells_per_group: 80
  min_donors_per_celltype: 12
  min_age_span: 12
  top_n_panels: 10
  dpi: 180

age_prediction:
  latent_key: X_scVI
  age_col: age
  donor_col: donor_id_y
  celltype_col: cell_type
  max_cells_for_aggregation: 200000
  min_cells_per_group: 80
  cv_folds: 5
  model_order: ["ridge", "xgboost"]
  ridge_alphas: [0.1, 1.0, 10.0, 100.0]
  xgboost_params:
    - {n_estimators: 300, max_depth: 3, learning_rate: 0.05, subsample: 0.8, colsample_bytree: 0.8, reg_lambda: 1.0}
    - {n_estimators: 500, max_depth: 4, learning_rate: 0.05, subsample: 0.8, colsample_bytree: 0.8, reg_lambda: 1.0}
  bootstrap_iterations: 5000
  bootstrap_ci: 0.95
  n_jobs: -1
  top_n_celltypes_plot: 14
  dpi: 180

analysis:
  age_bins: [25, 35, 45, 55, 65, 75, 85]
