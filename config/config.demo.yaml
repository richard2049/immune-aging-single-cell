cfg_path: config/config.demo.yaml

project:
  name: immune_aging_scvi
  out_dir: results

run:
  # demo_pbmc3k (small) or custom_h5ad (real data you place in data/raw)
  dataset: demo_pbmc3k
  seed: 42

paths:
  # used when dataset=custom_h5ad
  input_h5ad: data/raw/input.h5ad

metadata:
  enabled: false
  require_all_matches: true
  parse_obs_names: false
  table_path: null
  table_sep: ","
  obs_join_key: donor_id
  table_join_key: donor_id
  table_columns: []
  sample_field: sample_id
  donor_field: donor_id
  batch_field: batch
  barcode_field: cell_barcode
  sample_delim: auto
  donor_index: 1

qc:
  min_genes_per_cell: 200
  min_cells_per_gene: 3
  n_genes_upper_quantile: 0.98
  max_pct_counts_mt: 20
  # ribo detection will use gene name prefixes by default (RPL/RPS)
  max_pct_counts_ribo: 50

doublets:
  enabled: true
  dif_threshold: 0.5
  hvg_top: 2000
  filter_genes_min_cells: 3
  hvg_flavor: seurat_v3

scvi:
  layer: counts
  categorical_covariates: []
  continuous_covariates: ["pct_counts_mt", "total_counts", "pct_counts_ribo"]
  allow_missing_covariates: false
  # Default matches the portable CPU-only environment.yml.
  # Use "gpu" only after installing a CUDA-enabled PyTorch build.
  accelerator: cpu
  devices: 1

clustering:
  use_rep: X_scVI
  leiden_resolution: 0.8

celltypist:
  model: Immune_All_Low.pkl
  model_source: https://www.celltypist.org/models
  majority_voting: true

report:
  dpi: 150
  max_celltypes_plot: 20

composition_age:
  age_col: age
  donor_col: donor_id
  celltype_col: cell_type
  min_cells_per_donor: 50
  min_donors_per_celltype: 4
  top_n_celltypes: 8
  top_n_trends: 6
  dpi: 150

signature_age:
  age_col: age
  donor_col: donor_id
  celltype_col: cell_type
  sex_col: sex
  normalize_target_sum: 10000
  assume_log1p: false
  max_cells_for_scoring: 50000
  min_genes_present: 2
  min_cells_per_group: 20
  min_donors_per_celltype: 4
  min_age_span: 8
  top_n_panels: 6
  dpi: 150

age_prediction:
  latent_key: X_scVI
  age_col: age
  donor_col: donor_id
  celltype_col: cell_type
  max_cells_for_aggregation: 50000
  min_cells_per_group: 20
  cv_folds: 3
  model_order: ["ridge"]
  ridge_alphas: [0.1, 1.0, 10.0]
  bootstrap_iterations: 1000
  bootstrap_ci: 0.95
  n_jobs: -1
  top_n_celltypes_plot: 8
  dpi: 150

analysis:
  # expects obs column "age" for real aging datasets
  age_bins: [25, 35, 45, 55, 65, 75, 85]
