cfg_path: config/config.real.yml

project:
  name: immune_aging_scvi
  out_dir: results/gse164378_pilot
  # out_dir: results/gse164378_full

run:
  dataset: custom_h5ad
  # Pilot mode for very large datasets: ingest randomly samples this many cells.
  # Remove or set null for full-size runs.
  max_cells: 50000
  seed: 42

paths:
  input_h5ad: data/raw/raw_counts_h5ad/pbmc_gex_raw_with_var_obs.h5ad

metadata:
  enabled: true
  require_all_matches: true
  parse_obs_names: true
  # Cell-level metadata from all_pbmcs tarball.
  table_path: data/raw/raw_counts_h5ad/all_pbmcs/all_pbmcs_metadata.csv
  table_sep: ","
  obs_join_key: obs_names
  table_join_key: cell_id
  table_columns: ["donor_id", "age", "sex", "age_group", "batch"]
  auto_standardize_columns: true
  rename_columns: {}
  sample_field: sample_id
  donor_field: donor_id
  batch_field: batch
  barcode_field: cell_barcode
  sample_delim: auto
  donor_index: 1

qc:
  min_genes_per_cell: 200
  min_cells_per_gene: 3
  n_genes_upper_quantile: 0.98
  max_pct_counts_mt: 20
  max_pct_counts_ribo: 50

doublets:
  # Keep off for the first large-data pilot run.
  enabled: false
  dif_threshold: 0.5
  hvg_top: 2000
  filter_genes_min_cells: 10
  hvg_flavor: seurat_v3

scvi:
  layer: counts
  categorical_covariates: ["batch"]
  continuous_covariates: ["pct_counts_mt", "total_counts", "pct_counts_ribo"]
  allow_missing_covariates: false
  # Default matches the portable CPU-only environment.yml.
  # Use "gpu" only after installing a CUDA-enabled PyTorch build.
  accelerator: cpu
  devices: 1

clustering:
  use_rep: X_scVI
  leiden_resolution: 0.8

celltypist:
  enabled: true
  model: Immune_All_Low.pkl
  model_source: https://www.celltypist.org/models
  majority_voting: false
  chunk_size: 5000
  normalize_target_sum: 10000

report:
  dpi: 180
  max_celltypes_plot: 25
  label_obs: auto
  umap_point_size: auto
  umap_alpha: 0.85
  umap_legend_loc: right margin

composition_age:
  age_col: age
  donor_col: donor_id
  celltype_col: cell_type
  covariate_cols: ["sex", "batch"]
  adjust_covariates: true
  min_cells_per_donor: 200
  min_donors_per_age_bin: 8
  drop_sparse_age_bins: false
  sparse_age_bin_warn_threshold: 8
  sparse_age_bin_marker: "*"
  min_donors_per_celltype: 8
  min_donors_for_panel: 12
  bootstrap_iterations: 5000
  bootstrap_ci: 0.95
  plot_only_fdr_significant: true
  top_n_celltypes: 12
  top_n_trends: 8
  dpi: 180

signature_age:
  age_col: age
  donor_col: donor_id
  celltype_col: cell_type
  sex_col: sex
  covariate_cols: ["sex", "batch"]
  adjust_covariates: true
  normalize_target_sum: 10000
  assume_log1p: false
  sampling_strategy: stratified
  max_cells_for_scoring: 200000
  min_genes_present: 3
  min_cells_per_group: 50
  min_donors_per_celltype: 8
  min_donors_for_panel: 12
  plot_only_fdr_significant: true
  min_age_span: 10
  bootstrap_iterations: 5000
  bootstrap_ci: 0.95
  top_n_panels: 8
  dpi: 180

age_prediction:
  latent_key: X_scVI
  age_col: age
  donor_col: donor_id
  celltype_col: cell_type
  clip_predictions_to_train_age_range: true
  sampling_strategy: stratified
  max_cells_for_aggregation: 250000
  min_cells_per_group: 50
  cv_folds: 5
  model_order: ["ridge", "hist_gbr", "xgboost"]
  ridge_alphas: [0.1, 1.0, 10.0, 100.0]
  hist_gbr_params:
    - {max_depth: 4, learning_rate: 0.05, max_iter: 300}
    - {max_depth: 6, learning_rate: 0.03, max_iter: 500}
  xgboost_params:
    - {n_estimators: 300, max_depth: 3, learning_rate: 0.05, subsample: 0.8, colsample_bytree: 0.8, reg_lambda: 1.0}
    - {n_estimators: 500, max_depth: 4, learning_rate: 0.05, subsample: 0.8, colsample_bytree: 0.8, reg_lambda: 1.0}
  bootstrap_iterations: 5000
  bootstrap_ci: 0.95
  n_jobs: -1
  top_n_celltypes_plot: 12
  min_groups_for_mae_plot: 12
  dpi: 180

analysis:
  # expects obs column "age" for aging analyses
  age_bins: [25, 35, 45, 55, 65, 75, 85]

sensitivity_age:
  enabled: false
  include_baseline: true
  adjust_covariates_values: [true, false]
  drop_sparse_age_bins_values: [true, false]
  min_cells_per_group_values: [50, 80, 120]

supplementary_age:
  top_n_composition: 8
  top_n_signature: 8
  dpi: 180
