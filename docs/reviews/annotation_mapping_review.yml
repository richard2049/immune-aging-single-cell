composition_denominator_decision:
  status: approved
  selected_option: all_qc_passed_cells_with_other_unresolved
  recommended_option: all_qc_passed_cells_with_other_unresolved
  allowed_options:
  - all_qc_passed_cells_with_other_unresolved
  - primary_mapped_cells_only_with_explicit_label
  rationale: Retain every QC-passed cell in the composition denominator so that annotation uncertainty does not selectively change the estimand across samples. Other/unresolved is a primary-composition denominator category only; it does not overwrite raw CellTypist labels, exploratory analysis labels, dispositions, or secondary-validation candidates.
method_eligibility_review:
  status: approved
  decision: accept_current_method_specific_contracts
  recommended_decision: accept_current_method_specific_contracts
  rationale: Preserve method-specific support and estimability requirements. Eligibility for composition does not authorize signature, pseudobulk, or prediction analysis, and populations that fail a method contract remain excluded from that method unless a separately reviewed scientific decision changes the contract.
deferred_follow_up:
  task: Targeted secondary validation of potentially supportable immune-cell subtypes using the existing dataset
  status: proposed_after_primary_mapping_review
  timing: Complete the 17-label primary review first; do not block broad-label regeneration unless subtype-specific primary claims are planned
  scope: Within-lineage reclustering, prespecified subtype-marker evidence, cluster and classifier concordance, donor/sample/batch stability, and orthogonal PBMC reference mapping
  boundary: Preserve broad primary labels until a separate outcome-blind review supports finer categories; true tissue residency cannot be established from circulating PBMC transcriptomes alone
  priority_candidates:
  - raw_label: CD16+ NK cells
    proposed_subtype: CD16+ NK cells
    support: Strong FCGR3A and cytotoxic NK expression, coherent clustering, high classifier confidence, and study-wide representation
    required_review: Validate the subtype hierarchically against CD16-negative and generic NK assignments before primary subtype comparisons
  - raw_label: Regulatory T cells
    proposed_subtype: Regulatory T cells
    support: Strong T-cell identity, markedly enriched CTLA4, reduced IL7R relative to conventional CD4 populations, high classifier confidence, and study-wide representation
    required_review: Add outcome-blind FOXP3, IL2RA, TIGIT, IKZF2, and TNFRSF18 evidence before treating the annotation as more than a transcriptomic Treg identity or making subtype-specific functional claims
  - raw_label: Age-associated B cells
    proposed_subtype: Age-associated B cells
    support: Strong broad B-lineage expression, high classifier confidence, coherent B-cluster membership, and broad cohort representation
    required_review: Validate the state with outcome-blind TBX21, ITGAX, FCRL5, and related evidence before subtype-specific inference; the classifier label must not itself be treated as an observed age association
  - raw_label: CRTAM+ gamma-delta T cells
    proposed_subtype: Gamma-delta T cells
    support: Broad cohort representation and a coherent cytotoxic T-cell program support a plausible unconventional T-cell identity
    required_review: Confirm gamma-delta identity with outcome-blind TRDC, TRGC1/TRGC2, gamma/delta variable-region, or paired V(D)J evidence; CRTAM and shared cytotoxic markers are not subtype-specific
  - raw_label: NKT cells
    proposed_subtype: NKT-like cytotoxic T cells
    support: Broad cohort representation and joint T-cell and NK/cytotoxic expression support an NKT-like transcriptional phenotype
    required_review: Confirm invariant or CD1d-reactive NKT identity with outcome-blind paired TCR/V(D)J, TRAV10-TRAJ18, or orthogonal CD1d-tetramer evidence and inspect the discordant CD74 signal
  - raw_label: Plasma cells
    proposed_subtype: Antibody-secreting cells
    support: High classifier confidence, strong JCHAIN and CD79A expression, and concentrated cluster membership support an antibody-secreting B-lineage population
    required_review: Distinguish circulating plasmablasts from terminal plasma cells with outcome-blind MZB1, XBP1, PRDM1, SDC1, IRF4, immunoglobulin, and, where available, BCR evidence; reassess sparse sample and batch support before inference
  - raw_label: DC1
    proposed_subtype: cDC1
    support: High classifier confidence, broad antigen-presentation expression, and concentrated dendritic/myeloid cluster membership support a plausible dendritic-cell identity
    required_review: Confirm cDC1 with outcome-blind CLEC9A, XCR1, BATF3, IRF8, THBD/CD141, and monocyte-exclusion evidence before subtype-specific or primary inference
required_sensitivity_analyses:
- analysis_label: NK cells
  question: Do broad NK results depend materially on lower-confidence generic or CD16-negative NK assignments?
  primary_mapping: Include raw NK cells in the broad NK population
  sensitivity_mappings:
  - Exclude raw NK cells while retaining approved CD16-positive and CD16-negative NK assignments
  - Retain only the strongly supported CD16-positive NK assignment as a restrictive robustness bound
  interpretation_rule: If effect direction, magnitude, uncertainty, or eligibility changes materially, prioritize or explicitly qualify the restricted result before any biological claim
  status: approved_not_run
