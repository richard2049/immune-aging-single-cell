    sample_subject_support: adequate
    technical_distribution: adequate
    pbmc_plausibility: coherent
  final_decision:
    status: accept_as_proposed
    analysis_label: Regulatory T cells
    disposition: primary
    rationale: Strong T-cell identity, markedly enriched CTLA4, reduced IL7R relative to conventional CD4 populations, high classifier confidence, and broad cohort representation support a transcriptomic regulatory T-cell annotation. Primary use is limited to composition and pseudobulk, with signature estimates reported cautiously because few subjects satisfy the profile threshold; age prediction is not eligible. The label does not establish suppressive function or a specific Treg developmental subtype and is prioritized for outcome-blind secondary marker validation.
- review_order: 17
  raw_label: pDC
  proposed_analysis_label: pDC
  proposed_disposition: primary
