    technical_distribution: adequate
    pbmc_plausibility: coherent
  final_decision:
    status: accept_as_proposed
    analysis_label: Gamma-delta T cells
    disposition: exploratory
    rationale: Broad donor, sample, age, and batch representation together with CD3D, CD3E, NKG7, GNLY, and KLRD1 expression support a plausible cytotoxic T-cell identity. However, classifier confidence is low, the cells occupy a cluster dominated by other cytotoxic T, MAIT, and NK labels, and the current evidence package lacks TRDC, TRGC1/TRGC2, gamma/delta variable-region, or paired V(D)J evidence. The label therefore remains exploratory and excluded from primary inference until outcome-blind TCR-specific validation confirms gamma-delta identity.
