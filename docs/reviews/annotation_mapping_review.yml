- review_order: 44
  raw_label: CRTAM+ gamma-delta T cells
  proposed_analysis_label: Gamma-delta T cells
  proposed_disposition: exploratory
  mapping_rationale: Fine gamma-delta state lacks profile-level support
  evidence_row: CRTAM+ gamma-delta T cells
