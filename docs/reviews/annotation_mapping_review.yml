- review_order: 65
  raw_label: NKT cells
  proposed_analysis_label: NKT cells
  proposed_disposition: exploratory
  mapping_rationale: NKT prediction has low confidence and limited profile support
  evidence_row: NKT cells
  human_assessment:
    marker_coherence: inconclusive
    cluster_coherence: inconclusive
    sample_subject_support: adequate
    technical_distribution: adequate
    pbmc_plausibility: coherent
  final_decision:
    status: modify
    analysis_label: NKT-like cytotoxic T cells
    disposition: exploratory
    rationale: Broad donor, sample, age, and batch representation together with CD3D, CD3E, NKG7, GNLY, and KLRD1 expression support an NKT-like cytotoxic T-cell phenotype. However, classifier confidence is very low, the cells do not form a distinct cluster, the available evidence lacks invariant TCR or CD1d-reactivity support, and the frequent CD74 signal is discordant with a conventional NKT profile. The label is therefore changed to NKT-like cytotoxic T cells, retained as exploratory, and excluded from primary CD8 T-cell and NKT inference pending outcome-blind TCR/V(D)J or orthogonal validation.
- review_order: 66
  raw_label: Plasma cells
  proposed_analysis_label: Plasma cells
  proposed_disposition: exploratory
  mapping_rationale: Rare antibody-secreting population lacks profile-level support
  evidence_row: Plasma cells
  human_assessment:
    marker_coherence: coherent
    cluster_coherence: coherent
    sample_subject_support: inadequate
    technical_distribution: inconclusive
    pbmc_plausibility: coherent
  final_decision:
    status: modify
    analysis_label: Antibody-secreting cells
    disposition: exploratory
    rationale: High classifier confidence, strong JCHAIN and CD79A expression, and near-exclusive concentration in Leiden cluster 7 support an antibody-secreting B-lineage population. The 151 cells are nevertheless detected in only 90 sample units and 74 subjects, more than one third originate from one batch, and the current panel does not resolve circulating plasmablasts from terminal plasma cells. The label is therefore changed to Antibody-secreting cells, retained as exploratory, and excluded from primary composition, signature, pseudobulk, and prediction inference pending outcome-blind lineage-state and technical-stability validation.
