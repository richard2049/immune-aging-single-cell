    rationale: Strong GZMB, IL3RA, JCHAIN, and TCF4 expression, near-exclusive membership in a pDC-dominated Leiden cluster, high classifier confidence, and broad cohort representation support the pDC identity. Under the current executable contracts this population is primary for composition only. It must not support primary signature, age-prediction, pseudobulk, gene-level, pathway-level, interferon-activity, or functional pDC claims.
