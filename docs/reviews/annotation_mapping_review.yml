decisions:
- review_order: 1
  raw_label: B cells
  proposed_analysis_label: B cells
  proposed_disposition: primary
  mapping_rationale: Generic B-cell prediction can contribute to the broad B lineage
  evidence_row: B cells
  human_assessment:
    marker_coherence: inconclusive
    cluster_coherence: inconclusive
    sample_subject_support: adequate
    technical_distribution: adequate
    pbmc_plausibility: coherent
  final_decision:
    status: modify
    analysis_label: B cells
    disposition: exploratory
    rationale: Most cells lie in the B-cell cluster and express broad B-lineage markers, but classifier confidence is low, competing T/NK signals are appreciable, and more than one third of the label is distributed across non-B clusters. Exclusion from primary B-cell inference has negligible impact on sample size and improves specificity.
- review_order: 2
  raw_label: Memory B cells
  proposed_analysis_label: B cells
  proposed_disposition: primary
  mapping_rationale: Conventional well-supported circulating B-cell population
  evidence_row: Memory B cells
  human_assessment:
    marker_coherence: coherent
    cluster_coherence: coherent
    sample_subject_support: adequate
    technical_distribution: adequate
    pbmc_plausibility: coherent
  final_decision:
    status: accept_as_proposed
    analysis_label: B cells
    disposition: primary
    rationale: Broad B-cell identity is supported by coherent B-lineage markers, concentration in a B-cell Leiden cluster, and study-wide representation. The raw memory label is heterogeneous and is not independently eligible for every downstream method, but the aggregated B-cell population satisfies the method-specific contracts.
- review_order: 3
  raw_label: Naive B cells
  proposed_analysis_label: B cells
  proposed_disposition: primary
  mapping_rationale: Conventional well-supported circulating B-cell population
  evidence_row: Naive B cells
  human_assessment:
    marker_coherence: coherent
    cluster_coherence: coherent
    sample_subject_support: adequate
    technical_distribution: adequate
    pbmc_plausibility: coherent
  final_decision:
    status: accept_as_proposed
    analysis_label: B cells
    disposition: primary
    rationale: Broad B-cell identity is supported by coherent B-lineage markers, concentration in a B-cell Leiden cluster, and broad subject, sample, and batch representation. The evidence does not independently validate the naive subtype.
- review_order: 4
  raw_label: Tcm/Naive helper T cells
  proposed_analysis_label: CD4 T cells
  proposed_disposition: primary
  mapping_rationale: Well-supported broad helper T-cell compartment
  evidence_row: Tcm/Naive helper T cells
  human_assessment:
    marker_coherence: coherent
    cluster_coherence: coherent
    sample_subject_support: adequate
    technical_distribution: adequate
    pbmc_plausibility: coherent
  final_decision:
    status: accept_as_proposed
    analysis_label: CD4 T cells
    disposition: primary
    rationale: T-cell and helper-associated markers are coherent, competing CD8, NK, B-cell, and myeloid signals are limited, and the population is broadly represented across subjects, samples, and batches. Its distribution across several related helper T-cell clusters is expected for a large compartment. Naive and central-memory states are not considered independently validated.
- review_order: 5
  raw_label: Tem/Effector helper T cells
  proposed_analysis_label: CD4 T cells
  proposed_disposition: primary
  mapping_rationale: Well-supported broad helper T-cell compartment
  evidence_row: Tem/Effector helper T cells
  human_assessment:
    marker_coherence: coherent
    cluster_coherence: coherent
    sample_subject_support: adequate
    technical_distribution: adequate
    pbmc_plausibility: coherent
  final_decision:
    status: accept_as_proposed
    analysis_label: CD4 T cells
    disposition: primary
    rationale: Helper T-cell markers and cluster membership are coherent, the population is represented throughout the study, and all method-specific design contracts pass. Limited cytotoxic-marker expression and minor spillover into a cytotoxic cluster do not contradict the broad CD4 assignment. The Tem/effector subtype is not considered independently validated.
- review_order: 6
  raw_label: Tcm/Naive cytotoxic T cells
  proposed_analysis_label: CD8 T cells
  proposed_disposition: primary
  mapping_rationale: Well-supported broad cytotoxic T-cell compartment
  evidence_row: Tcm/Naive cytotoxic T cells
  human_assessment:
    marker_coherence: coherent
    cluster_coherence: coherent
    sample_subject_support: adequate
    technical_distribution: adequate
    pbmc_plausibility: coherent
  final_decision:
    status: accept_as_proposed
    analysis_label: CD8 T cells
    disposition: primary
    rationale: Strong CD3, CD8A, and CD8B expression supports CD8 T-cell identity, while IL7R/LTB expression and limited cytotoxic-marker activity are compatible with naive or central-memory states. Cluster, subject, sample, and batch support are coherent. Naive and central-memory states are not considered independently validated.
- review_order: 7
  raw_label: Tem/Temra cytotoxic T cells
  proposed_analysis_label: CD8 T cells
  proposed_disposition: primary
  mapping_rationale: Well-supported broad cytotoxic T-cell compartment
  evidence_row: Tem/Temra cytotoxic T cells
  human_assessment:
    marker_coherence: coherent
    cluster_coherence: coherent
    sample_subject_support: adequate
    technical_distribution: adequate
    pbmc_plausibility: coherent
  final_decision:
    status: accept_as_proposed
    analysis_label: CD8 T cells
    disposition: primary
    rationale: Strong CD3 and CD8 expression supports T-cell identity, while the cytotoxic program and dominant-cluster membership are coherent with effector CD8 states. Limited spillover into the NK-dominated cluster does not justify excluding the population. Tem and TEMRA states, and the boundary with NK-like T cells, are not considered independently validated.
- review_order: 8
  raw_label: Tem/Trm cytotoxic T cells
  proposed_analysis_label: CD8 T cells
  proposed_disposition: primary
  mapping_rationale: Well-supported broad cytotoxic T-cell compartment
  evidence_row: Tem/Trm cytotoxic T cells
  human_assessment:
    marker_coherence: coherent
    cluster_coherence: coherent
    sample_subject_support: adequate
    technical_distribution: adequate
    pbmc_plausibility: coherent
  final_decision:
    status: accept_as_proposed
    analysis_label: CD8 T cells
    disposition: primary
    rationale: Strong T-cell and CD8-lineage expression, a cytotoxic-memory program, dominant membership in a compatible cluster, and broad study representation support the broad CD8 assignment. Partial spillover into a helper-dominated cluster and lower-confidence cells warrant caution but do not justify exclusion. Tem and Trm states are not considered independently validated, and tissue residency cannot be inferred from circulating PBMC transcriptomes alone.
- review_order: 9
  raw_label: Classical monocytes
  proposed_analysis_label: Classical monocytes
  proposed_disposition: primary
  mapping_rationale: Conventional well-supported PBMC population
  evidence_row: Classical monocytes
  human_assessment:
    marker_coherence: coherent
    cluster_coherence: coherent
    sample_subject_support: adequate
    technical_distribution: adequate
    pbmc_plausibility: coherent
  final_decision:
    status: accept_as_proposed
    analysis_label: Classical monocytes
    disposition: primary
    rationale: Strong S100A8, S100A9, LST1, and CTSD expression, negligible lymphoid-marker activity, dominant membership in a compatible Leiden cluster, and study-wide representation support the classical-monocyte identity. HLA-II-associated expression is compatible with activation or antigen presentation and does not contradict the lineage assignment. The population passes all method-specific support contracts.
- review_order: 10
  raw_label: DC2
  proposed_analysis_label: Dendritic cells
  proposed_disposition: primary
  mapping_rationale: Conventional circulating dendritic prediction
  evidence_row: DC2
  human_assessment:
    marker_coherence: coherent
    cluster_coherence: coherent
    sample_subject_support: adequate
    technical_distribution: adequate
    pbmc_plausibility: coherent
  final_decision:
    status: accept_as_proposed
    analysis_label: Dendritic cells
    disposition: primary
    rationale: CD1C, FCER1A, CST3, and HLA-DRA expression, dominant membership in a compatible myeloid cluster, and broad study representation support a conservative dendritic-cell assignment. Monocyte-associated expression, mixing with classical monocytes, and low profile counts limit specificity and inferential scope. Under the current executable contracts this population is primary for composition only; it must not support primary signature, age-prediction, pseudobulk, gene-level, pathway-level, or DC2-versus-DC3 claims.
- review_order: 11
  raw_label: MAIT cells
  proposed_analysis_label: MAIT cells
  proposed_disposition: primary
  mapping_rationale: Conventional circulating innate-like T-cell population
  evidence_row: MAIT cells
  human_assessment:
    marker_coherence: coherent
    cluster_coherence: coherent
    sample_subject_support: adequate
    technical_distribution: adequate
    pbmc_plausibility: coherent
  final_decision:
    status: accept_as_proposed
    analysis_label: MAIT cells
    disposition: primary
    rationale: A coherent T-cell, KLRB1, SLC4A10, and cytotoxic expression program, concentration in a compatible Leiden cluster, high classifier confidence, and broad study representation support a transcriptomic MAIT annotation. All method-specific contracts pass, although signature and age-prediction estimates rely on fewer eligible subjects and require appropriately wide uncertainty. The label does not establish MR1 restriction, invariant TCR usage, antigen recognition, or experimentally confirmed MAIT function.
- review_order: 12
  raw_label: CD16+ NK cells
  proposed_analysis_label: NK cells
  proposed_disposition: primary
  mapping_rationale: Conventional circulating NK-cell prediction
  evidence_row: CD16+ NK cells
  human_assessment:
    marker_coherence: coherent
    cluster_coherence: coherent
    sample_subject_support: adequate
    technical_distribution: adequate
    pbmc_plausibility: coherent
  final_decision:
    status: accept_as_proposed
    analysis_label: NK cells
    disposition: primary
    rationale: Strong FCGR3A, GNLY, KLRD1, NKG7, and cytotoxic expression, concentration in a highly compatible NK cluster, high classifier confidence, and study-wide representation support NK identity and a plausible CD16-positive subtype. The broad NK mapping is retained for robust primary inference because CD16-negative and generic NK assignments have weaker and asymmetric certainty. The raw CD16+ NK label is preserved as a supported subtype and prioritized for outcome-blind secondary validation before primary subtype comparisons.
- review_order: 13
  raw_label: CD16- NK cells
  proposed_analysis_label: NK cells
  proposed_disposition: primary
  mapping_rationale: Conventional circulating NK-cell prediction with confidence sensitivity required
  evidence_row: CD16- NK cells
  human_assessment:
    marker_coherence: coherent
    cluster_coherence: coherent
    sample_subject_support: adequate
    technical_distribution: adequate
    pbmc_plausibility: coherent
  final_decision:
    status: accept_as_proposed
    analysis_label: NK cells
    disposition: primary
    rationale: Strong GNLY, KLRD1, and NKG7 expression, concentration in compatible NK clusters, and broad cohort representation support inclusion in the aggregated NK compartment. Moderate classifier confidence and detectable FCGR3A make the CD16-negative subtype less secure than the broad lineage assignment. The raw subtype must not support standalone primary inference; broad NK results require prespecified nested sensitivities excluding the generic NK label and then retaining only the strongly supported CD16-positive assignment as a restrictive robustness bound.
- review_order: 14
  raw_label: NK cells
  proposed_analysis_label: NK cells
  proposed_disposition: primary
  mapping_rationale: Generic NK prediction can contribute to the broad NK lineage
  evidence_row: NK cells
  human_assessment:
    marker_coherence: coherent
    cluster_coherence: inconclusive
    sample_subject_support: adequate
    technical_distribution: adequate
    pbmc_plausibility: coherent
  final_decision:
    status: accept_as_proposed
    analysis_label: NK cells
    disposition: primary
    rationale: Strong GNLY, KLRD1, and NKG7 expression and broad study representation support contribution to the aggregated NK compartment, but low classifier confidence, substantial T-lineage expression, and dispersion across cytotoxic clusters make the raw generic label unsuitable as a standalone population. It is included in broad primary NK analyses only with a prespecified sensitivity that excludes this raw label. Material changes in effect direction, magnitude, uncertainty, or eligibility must be reported and the restricted result prioritized or explicitly qualified before biological interpretation.
- review_order: 15
  raw_label: Non-classical monocytes
  proposed_analysis_label: Non-classical monocytes
  proposed_disposition: primary
  mapping_rationale: Conventional well-supported PBMC population
  evidence_row: Non-classical monocytes
  human_assessment:
    marker_coherence: coherent
    cluster_coherence: coherent
    sample_subject_support: adequate
    technical_distribution: adequate
    pbmc_plausibility: coherent
  final_decision:
    status: accept_as_proposed
    analysis_label: Non-classical monocytes
    disposition: primary
    rationale: Strong FCGR3A, LILRB1, LST1, and MS4A7 expression, negligible lymphoid-marker activity, high classifier confidence, and study-wide representation support a non-classical-monocyte assignment. Markedly higher FCGR3A and lower S100A8/S100A9 expression than classical monocytes provide convergent subtype evidence despite shared Leiden-cluster membership. The label denotes a supported state within a monocyte continuum rather than a perfectly discrete lineage.
- review_order: 16
  raw_label: Regulatory T cells
  proposed_analysis_label: Regulatory T cells
  proposed_disposition: primary
  mapping_rationale: Conventional well-supported regulatory T-cell population
  evidence_row: Regulatory T cells
  human_assessment:
