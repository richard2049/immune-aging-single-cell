- review_order: 39
  raw_label: DC1
  proposed_analysis_label: Dendritic cells
  proposed_disposition: exploratory
  mapping_rationale: Conventional dendritic subtype has limited profile support
  evidence_row: DC1
  human_assessment:
    marker_coherence: inconclusive
    cluster_coherence: coherent
    sample_subject_support: inadequate
    technical_distribution: inconclusive
    pbmc_plausibility: coherent
  final_decision:
    status: accept_as_proposed
    analysis_label: Dendritic cells
    disposition: exploratory
    rationale: High classifier confidence, complete HLA-DRA, CD74, and CST3 detection, and near-exclusive concentration in the dendritic/myeloid Leiden cluster support a plausible antigen-presenting dendritic-cell identity. However, only 124 cells are detected across 76 sample units and 66 subjects, one batch contributes one third of the cells, the cluster also contains classical monocytes, and the current evidence lacks CLEC9A, XCR1, BATF3, IRF8, or THBD/CD141 confirmation. The broad Dendritic cells label therefore remains exploratory and excluded from primary inference until outcome-blind cDC1 and monocyte-exclusion validation is completed.
