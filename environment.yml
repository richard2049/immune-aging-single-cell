# environment.yml
# Reproducible environment for the immune-aging-scvi subproject.
# Default: CPU-only PyTorch (portable). For GPU, see docs/troubleshooting.md.

name: immune-aging-scvi

channels:
  - conda-forge
  - bioconda
  - pytorch
  - nodefaults

dependencies:
  # --- Python ---
  - python=3.10
  - pip
  - pyyaml=6.0.*

  # --- Core scientific stack ---
  - numpy=2.2.*
  - pandas=2.3.*
  - scipy=1.15.*
  - scikit-learn=1.7.*
  - xgboost=2.1.*

  # --- Single-cell stack ---
  - anndata=0.11.*
  - scanpy=1.11.*
  - umap-learn=0.5.*
  - python-igraph=1.0.*
  - leidenalg=0.12.*
  - h5py=3.13.*
  - pytables=3.10.*

  # --- Workflow / plotting ---
  - snakemake-minimal=7.32.*
  - matplotlib=3.10.*

  # --- PyTorch (CPU default; swap for CUDA build if needed) ---
  - pytorch=2.5.*
  - torchvision=0.20.*
  - torchaudio=2.5.*
  - cpuonly

  # --- PyPI packages ---
  - pip:
      - scvi-tools==1.3.3
      - celltypist==1.7.1
      - scikit-misc==0.5.2
