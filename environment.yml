# environment.yml
# Reproducible environment for the immune-aging-scvi subproject.
# Default: CPU-only PyTorch (portable). For GPU, see docs/troubleshooting.md.

name: immune-aging-scvi

channels:
  - conda-forge
  - bioconda
  - nodefaults

dependencies:
  # --- Python ---
  - python=3.10
  - pip
  - pyyaml=6.0.*

  # --- Core scientific stack ---
  - numpy=2.2.*
  - pandas=2.3.*
  - scipy=1.15.*
  - scikit-learn=1.7.*
  # The maintained workflow uses the CPU XGBoost backend. Pin the build so
  # CUDA virtual-package detection cannot introduce a second CUDA runtime.
  - xgboost=2.1.*=cpu_*

  # --- Single-cell stack ---
  - anndata=0.11.*
  - scanpy=1.11.*
  - umap-learn=0.5.*
  - python-igraph=1.0.*
  - leidenalg=0.12.*
  - h5py=3.13.*
  - pytables=3.10.*

  # --- Workflow / plotting ---
  - snakemake-minimal=7.32.*
  - matplotlib=3.10.*

  # --- PyPI packages ---
  - pip:
      # Use the official CPU index so GPU detection cannot change the selected
      # PyTorch build on otherwise identical hosts.
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - torch==2.5.1+cpu
      - torchvision==0.20.1+cpu
      - torchaudio==2.5.1+cpu
      - scvi-tools==1.3.3
      - celltypist==1.7.1
      - scikit-misc==0.5.2
